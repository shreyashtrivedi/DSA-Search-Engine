<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22>
        <text y=%22.9em%22 font-size=%2290%22>🔎</text></svg>">
    <title>DSA Search Engine</title>
</head>
<body>
    <div class = 'container'>
        <div class = "hero-content">
            <h1> Search 3500+ DSA problems in seconds </h1>
            <p class = "tagline">
                Instantly find coding challengers across
                <img
                src = "assets/codeforces.png"
                alt = "codeforces"
                class = "platform-icon" 
                />
                 <img
                src = "assets/codechef.png"
                alt = "codechef"
                class = "platform-icon" 
                />
                 <img
                src = "assets/leetcode.png"
                alt = "leetcode"
                class = "platform-icon" 
                />
                all in one place!!!!
            </p>
        </div>
        <form class = "search-form" id = "search-form">
            <input
            id = "query-input"
            class = "query-input"
            type = "text"
            placeholder = "Enter Problem Name"
            autocomplete ="off"
            />
            <button type = "submit"> Search </button>
        </form>

        <p class = "cta"> Type a topic,tag or title above to begin your search </p>
        <div id = "spinner" class = "spinner-hidden" aria-hidden = "true"></div>
        <div id = "results" class = "results"></div>
    </div>

    <script src = "./script.js"></script>

</body>
</html>
